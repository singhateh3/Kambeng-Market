# render.yaml
services:
  - type: web
    name: kambeng-market-api
    runtime: image
    image:
      url: your-docker-image-url
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        value: https://kambeng-market-frontend.vercel.app
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SANCTUM_TOKEN_EXPIRATION
        value: 43200